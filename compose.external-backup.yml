name: hongshu
# Optional independent backup for external/shared MySQL. Merge with compose.external.yml.
services:
  backup:
    image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/backup.sh"]
    environment:
      MYSQL_HOST: ${BACKUP_MYSQL_HOST:?set BACKUP_MYSQL_HOST}
      MYSQL_PORT: ${BACKUP_MYSQL_PORT:-3306}
      MYSQL_USER: ${BACKUP_MYSQL_USER:?set BACKUP_MYSQL_USER}
      MYSQL_DATABASE: ${BACKUP_MYSQL_DATABASE:-hongshu}
      MYSQL_PWD: ${BACKUP_MYSQL_PWD:?set BACKUP_MYSQL_PWD}
      MYSQL_SSL_MODE: ${BACKUP_MYSQL_SSL_MODE:-PREFERRED}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_TIMEOUT: ${BACKUP_TIMEOUT:-3600}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
      BACKUP_MAX_FILES: ${BACKUP_MAX_FILES:-60}
      BACKUP_HEALTH_GRACE: ${BACKUP_HEALTH_GRACE:-900}
    volumes: ["./scripts/backup.sh:/backup.sh:ro", "./scripts/backup-healthcheck.sh:/backup-healthcheck.sh:ro", "./runtime-data/backups:/backups"]
    healthcheck:
      test: [CMD, /bin/bash, /backup-healthcheck.sh]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 2h
    networks: [egress]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  egress: {}

name: hongshu
# External/shared MySQL deployment. Run:
#   docker compose -f compose.external.yml up -d
# The database must already exist with utf8mb4/utf8mb4_bin. Set HONGSHU_DATABASE_URL
# in .env (or the environment); see docs/DATABASE.md.
services:
  hub:
    image: ${HONGSHU_IMAGE:-ghcr.io/igngserver/hongshu}:${HONGSHU_VERSION:?select an explicitly published version}
    restart: unless-stopped
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ["${BIND_ADDRESS:-127.0.0.1}:${PORT:-18473}:8080"]
    environment:
      HONGSHU_DATABASE_URL: ${HONGSHU_DATABASE_URL:?set HONGSHU_DATABASE_URL for external MySQL}
      HONGSHU_DB_MAX_OPEN: ${HONGSHU_DB_MAX_OPEN:-}
      HONGSHU_DB_MAX_IDLE: ${HONGSHU_DB_MAX_IDLE:-}
      HONGSHU_DB_CONN_MAX_LIFETIME: ${HONGSHU_DB_CONN_MAX_LIFETIME:-}
      HONGSHU_DB_CONN_MAX_IDLE_TIME: ${HONGSHU_DB_CONN_MAX_IDLE_TIME:-}
      HONGSHU_DB_STARTUP_TIMEOUT: ${HONGSHU_DB_STARTUP_TIMEOUT:-}
      HONGSHU_DB_TLS_CA: ${HONGSHU_DB_TLS_CA:-}
      HONGSHU_DB_TLS_SERVER_NAME: ${HONGSHU_DB_TLS_SERVER_NAME:-}
      HONGSHU_MIGRATE: ${HONGSHU_MIGRATE:-auto}
      HONGSHU_MIGRATION_LOCK_TIMEOUT: ${HONGSHU_MIGRATION_LOCK_TIMEOUT:-}
      HONGSHU_REDIS_URL: ${HONGSHU_REDIS_URL:-}
      HONGSHU_REDIS_PREFIX: ${HONGSHU_REDIS_PREFIX:-}
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:18473}
      HONGSHU_PASSWORD: ${HONGSHU_PASSWORD:?set HONGSHU_PASSWORD}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-}
      HONGSHU_AI_SECRET: ${HONGSHU_AI_SECRET:-}
      HONGSHU_AI_ALLOWED_HOSTS: ${HONGSHU_AI_ALLOWED_HOSTS:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.invalid}
    healthcheck:
      test: [CMD, /healthcheck]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [egress]
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
networks:
  egress: {}

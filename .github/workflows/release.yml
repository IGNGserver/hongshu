name: Hongshu release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish or recover
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  release:
    name: validate and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      mysql:
        image: mysql:8.4.5
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      TEST_MYSQL_DSN: root@tcp(127.0.0.1:3306)/?timeout=5s
      MYSQL_BIN: /usr/bin/mysql
      MYSQLDUMP_BIN: /usr/bin/mysqldump
    steps:
      - name: Check out release source and history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - name: Configure build caches outside the checkout
        run: |
          printf 'GRADLE_USER_HOME=%s/gradle\nHONGSHU_BUILD_DIR=%s/hongshu\nWEB_BUILD_DIR=%s/hongshu/web\n' "$RUNNER_TEMP" "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Verify release tag, VERSION, and main ancestry
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=${TAG#v}
          test "$(tr -d '[:space:]' < VERSION)" = "$version"
          [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?$ ]]
          git fetch origin main --quiet
          git fetch origin "+refs/tags/$TAG:refs/tags/$TAG" --quiet
          release_sha=$(git rev-parse "$TAG^{commit}")
          test "$(git rev-parse HEAD)" = "$release_sha"
          git merge-base --is-ancestor "$release_sha" origin/main
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]]; then
            test "$release_sha" = "$GITHUB_SHA"
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/release-state" 2>/dev/null; then
            test "$(cat "$RUNNER_TEMP/release-state")" = true || { echo 'Published release is immutable' >&2; exit 1; }
          fi
          is_prerelease=false
          if [[ "$version" =~ -(alpha|beta|rc)\.[1-9][0-9]*$ ]]; then
            is_prerelease=true
          fi
          printf 'TAG=%s\nVERSION=%s\nRELEASE_SHA=%s\nIS_PRERELEASE=%s\n' "$TAG" "$version" "$release_sha" "$is_prerelease" >> "$GITHUB_ENV"

      - name: Verify repository contract and whitespace
        run: bash scripts/verify-repository.sh && git diff --check

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Test and build Go service
        working-directory: server
        run: |
          set -euo pipefail
          test -z "$(gofmt -l *.go cmd/*/*.go)"
          go test -race -count=1 ./...
          go vet ./...
          mkdir -p "$HONGSHU_BUILD_DIR"
          go build -trimpath -ldflags "-X main.buildVersion=$VERSION" -o "$HONGSHU_BUILD_DIR/hongshu-linux-amd64" .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Test and build Web/PWA
        working-directory: web
        run: npm ci && npm test && npm run check && npm run build

      - name: Install browser smoke dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" --no-save playwright@1.56.1
          "$RUNNER_TEMP/browser-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Exercise browser against isolated MySQL
        run: node scripts/browser-smoke.cjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser-tools/node_modules/playwright
          HONGSHU_BINARY: ${{ runner.temp }}/hongshu/hongshu-linux-amd64
          TEST_MYSQL_PORT: "3306"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Decode Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret" >&2; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.p12"

      - name: Test and build signed Android release package
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --project-cache-dir "$GRADLE_USER_HOME/project-cache" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleRelease \
            -PandroidKeystorePath="$RUNNER_TEMP/release.p12" \
            -PandroidKeystorePassword="$ANDROID_KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$ANDROID_KEY_ALIAS" \
            -PandroidKeyPassword="$ANDROID_KEY_PASSWORD"

      - name: Assemble and preflight all assets before registry writes
        run: |
          set -euo pipefail
          release="$HONGSHU_BUILD_DIR/release"
          deployment_stage="$HONGSHU_BUILD_DIR/deployment"
          mkdir -p "$release"
          test -s "docs/releases/${TAG}.md"
          test -s "$HONGSHU_BUILD_DIR/app/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$HONGSHU_BUILD_DIR/app/outputs/apk/release/app-release.apk"
          cp "$HONGSHU_BUILD_DIR/app/outputs/apk/release/app-release.apk" "$release/Hongshu-Android-${VERSION}.apk"
          test -s "$HONGSHU_BUILD_DIR/hongshu-linux-amd64"

          rm -rf "$deployment_stage"
          mkdir -p "$deployment_stage/scripts" "$deployment_stage/docs"
          cp compose.yml .env.example VERSION "$deployment_stage/"
          cp scripts/backup.sh scripts/init-deployment.sh scripts/next-restore-epoch.sh scripts/repair-read-watermarks.sql "$deployment_stage/scripts/"
          cp docs/DEPLOYMENT.md "$deployment_stage/docs/"

          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C "$deployment_stage" -cf - .env.example VERSION compose.yml scripts docs | gzip -n > "$release/hongshu-${TAG}-deployment.tar.gz"

          test "$(find "$release" -maxdepth 1 -type f | wc -l)" -eq 2
          test -s "$release/Hongshu-Android-${VERSION}.apk"
          test -s "$release/hongshu-${TAG}-deployment.tar.gz"
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'compose.yml'
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'scripts/init-deployment.sh'
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'scripts/backup.sh'
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'scripts/next-restore-epoch.sh'
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'scripts/repair-read-watermarks.sql'
          tar -tzf "$release/hongshu-${TAG}-deployment.tar.gz" | grep -Fx 'docs/DEPLOYMENT.md'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage digest, journal draft, promote version tags and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_IMAGE: ghcr.io/${{ github.repository_owner }}/hongshu
          RELEASE_OWNER: ${{ github.repository_owner }}
        run: |
          bash scripts/publish-release.sh

      - name: Trigger website deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${GITHUB_REPOSITORY}/dispatches" -f event_type=release-published

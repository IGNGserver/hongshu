name: Hongshu validation

on:
  push:
    paths: ['.dockerignore', 'Dockerfile', 'server/**', 'web/**', 'android/**', 'db/**', 'scripts/**', 'website/**', 'docs/**', '.github/workflows/ci.yml', '.github/workflows/release.yml', '.github/workflows/website.yml', 'compose.yml', 'compose.external.yml', 'compose.external-backup.yml', '.env.example', 'VERSION']
  pull_request:
    paths: ['.dockerignore', 'Dockerfile', 'server/**', 'web/**', 'android/**', 'db/**', 'scripts/**', 'website/**', 'docs/**', '.github/workflows/ci.yml', '.github/workflows/release.yml', '.github/workflows/website.yml', 'compose.yml', 'compose.external.yml', 'compose.external-backup.yml', '.env.example', 'VERSION']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan repository history for committed credentials
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Review new dependency risk and licenses
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
      - name: Verify repository contract
        run: bash scripts/verify-repository.sh
      - name: Check whitespace errors
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          base=${PR_BASE_SHA:-$(git merge-base HEAD "origin/$DEFAULT_BRANCH")}
          git diff --check "$base" HEAD
          git show --format= --check HEAD
  server:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4.5@sha256:679e7e924f38a3cbb62a3d7df32924b83f7321a602d3f9f967c01b3df18495d6
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_ROOT_HOST: "%"
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      TEST_MYSQL_DSN: root@tcp(127.0.0.1:3306)/?timeout=5s
      MYSQL_BIN: /usr/bin/mysql
      MYSQLDUMP_BIN: /usr/bin/mysqldump
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.4"
          cache-dependency-path: server/go.sum
      - run: sudo apt-get update && sudo apt-get install -y mysql-client
      - run: test -z "$(gofmt -l *.go cmd/vapid/*.go)"
        working-directory: server
      - run: go test -race -count=1 -v ./... && go vet ./... && go build -trimpath -o "$RUNNER_TEMP/hongshu" .
        working-directory: server
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - run: npm ci --prefix web
      - run: web/node_modules/.bin/playwright install --with-deps chromium
      - run: WEB_BUILD_DIR="$RUNNER_TEMP/hongshu-web" npm --prefix web run build
      - run: PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/web/node_modules/playwright" HONGSHU_BINARY="$RUNNER_TEMP/hongshu" node scripts/browser-smoke.cjs
        env:
          TEST_MYSQL_PORT: "3306"
          WEB_BUILD_DIR: "${{ runner.temp }}/hongshu-web"
      - name: Verify device-only contact Picker and IndexedDB presentation
        run: PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/web/node_modules/playwright" WEB_BUILD_DIR="$RUNNER_TEMP/hongshu-web" node scripts/local-contacts-smoke.cjs
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: "22"}
      - run: npm ci && npm test && npm run check && npm run build
        working-directory: web
        env: {WEB_BUILD_DIR: "${{ runner.temp }}/hongshu-web"}
      - name: Install isolated PWA browser test runtime
        run: |
          npm ci
          ./node_modules/.bin/playwright install --with-deps chromium
        working-directory: web
      - name: Verify install assets, adaptive layout and actual Service Worker lifecycle
        run: node scripts/pwa-browser-smoke.cjs
        env:
          PLAYWRIGHT_MODULE: "${{ github.workspace }}/web/node_modules/playwright"
          WEB_BUILD_DIR: "${{ runner.temp }}/hongshu-web"
  container:
    name: container image build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          load: true
          tags: hongshu:pull-request
      - name: Block high and critical fixable image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # 0.35.0
        with:
          image-ref: hongshu:pull-request
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [28, 33, 35]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: |
          printf 'GRADLE_USER_HOME=%s/gradle\nHONGSHU_BUILD_DIR=%s/hongshu-android\n' "$RUNNER_TEMP" "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
      - uses: gradle/actions/wrapper-validation@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./gradlew --no-daemon --project-cache-dir "$GRADLE_USER_HOME/project-cache" :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
        working-directory: android
      - name: Enable hardware acceleration for the isolated test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise capture, task visibility and realtime lifecycle on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          working-directory: android
          disable-animations: true
          script: ./gradlew --no-daemon --project-cache-dir "$GRADLE_USER_HOME/project-cache" :app:connectedDebugAndroidTest
      - name: Show isolated instrumented test failure details
        if: failure()
        run: |
          python3 - <<'PY'
          import os, pathlib, xml.etree.ElementTree as ET
          root = pathlib.Path(os.environ['HONGSHU_BUILD_DIR']) / 'app/outputs/androidTest-results'
          for path in root.rglob('*.xml'):
              for case in ET.parse(path).iter('testcase'):
                  for failure in case.findall('failure') + case.findall('error'):
                      print(case.get('classname'), case.get('name'))
                      print(failure.text or failure.get('message', ''))
          PY
